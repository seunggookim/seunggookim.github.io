# ===================================================================
#  cv.yml -- content of the CV (everything except publications)
#  Build:   python3 _gen-cv/makecv.py            (full version)
#           python3 _gen-cv/makecv.py --public   (website copy)
#
#  Text markup (plain text is escaped for LaTeX):
#    *italic*   **bold**   ^+ or ^* (superscript mark)
#    bare URLs and doi:10.xxx/yyy become links
#    TODO(...)  renders as a red [TODO: ...]
#    keys ending in _tex are raw LaTeX (not escaped)
#  'when' labels: "2021-present" -> "2021–Present"
#  timeline item keys: when, what, role ("Current role:" if when ends in present), amount
#                      ("- Funding: ..."; hidden with --no-amounts),
#                      details (- lines), lines (no dash)
#  talk item keys:     date (YYYY-MM[-DD]), authors, title, venue, note
#  Section types: bullets | timeline | talks | publications | reviews
#                 | referees | text
# ===================================================================

